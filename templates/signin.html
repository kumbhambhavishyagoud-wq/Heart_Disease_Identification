{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<section class="login-bg">
  <form class="login-card" method="post">
    <h1>SIGN UP HERE</h1>

    <label>Username
      <input 
        name="username" 
        type="text"
        required 
        minlength="4" 
        maxlength="20" 
        pattern="^[a-zA-Z0-9_]+$" 
        title="4 to 20 characters. Only letters, numbers, and underscores allowed."
        placeholder="Choose a username (4-20 chars)">
    </label>

    <label>Password
      <input 
        name="password" 
        type="password" 
        required 
        minlength="8" 
        maxlength="64" 
        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" 
        title="Must contain at least 8 characters, including 1 uppercase letter, 1 lowercase letter, 1 number, and 1 special character."
        placeholder="Create a strong password">
    </label>

    <label>Confirm Password
      <input 
        name="confirm_password" 
        type="password" 
        required 
        minlength="8" 
        placeholder="Re-enter your password">
    </label>

    <button class="btn" type="submit">CREATE ACCOUNT</button>

    <p class="demo">
      Password must have <b>8+ chars</b>, an <b>uppercase</b>, a <b>lowercase</b>, a <b>number</b>, and a <b>special symbol</b>.<br><br>
      Already have an account? <a href="{{ url_for('login') }}"><b>Login here</b></a>
    </p>
  </form>
</section>
{% endblock %}
